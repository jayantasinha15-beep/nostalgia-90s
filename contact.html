<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | 90s Sunday Living Room</title>
  
  <!-- Retro Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=VT323&family=Patrick+Hand&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --room-bg: #140b07;
      --wood-shelf: #381c0d;
      --amber-glow: #ffb703;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: 
        linear-gradient(
          rgba(35, 17, 8, 0.45),
          rgba(15, 6, 2, 0.72)
        ),
        url('images/bg-room.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Patrick Hand', cursive;
      color: #fcf8f2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: #fdfbf7;
      border: 4px solid #b45309;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      color: #2b1d14;
      position: relative;
    }

    .back-home {
      display: inline-block;
      margin-bottom: 15px;
      font-family: 'Caveat', cursive;
      font-size: 1.2rem;
      color: #9a3412;
      text-decoration: underline;
    }

    h2 {
      font-family: 'Caveat', cursive;
      font-size: 2.8rem;
      color: #7c2d12;
      text-align: center;
      margin-bottom: 8px;
    }

    p.subtitle {
      text-align: center;
      font-size: 1.1rem;
      color: #5a341a;
      margin-bottom: 24px;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 1.1rem;
      color: #7c2d12;
      margin-bottom: 4px;
      font-weight: bold;
      font-family: 'Caveat', cursive;
    }

    .form-group input, 
    .form-group textarea {
      padding: 10px 12px;
      border: 2px solid #d4a373;
      border-radius: 6px;
      background: #fff;
      font-family: 'Patrick Hand', cursive;
      font-size: 1.1rem;
      color: #2b1d14;
    }

    .form-group textarea {
      resize: vertical;
      height: 120px;
    }

    .submit-btn {
      background: #b45309;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 25px;
      font-family: 'Caveat', cursive;
      font-size: 1.4rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
      align-self: center;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #7c2d12;
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      margin-top: 40px;
      font-family: 'Special Elite', cursive;
      font-size: 0.95rem;
      color: #fed7aa;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-home">← Back to Home</a>
    <h2>📬 Contact 90s Living Room</h2>
    <p class="subtitle">Kono suggestion ba purono memory share korte chan? Amader message pathan!</p>

    <!-- 
      STEP 3: Google Form Link ekhane connect korte hobe. 
      Nicher action URL-er jaygay apnar Google Form-er action link bosiye deben.
    -->
    <form class="contact-form" action="https://docs.google.com/forms/d/1pGxk_kiJn45VlWeyyYsqKs-oTYYiYbt_y5224qbT31g/formResponse" method="POST" target="_blank">
      
      <div class="form-group">
        <label for="name">Tomar Naam (Name):</label>
        <input type="text" id="name" name="entry.NAMER_ENTRY_ID" placeholder="Apnar nam likhun..." required>
      </div>

      <div class="form-group">
        <label for="email">Tomar Email:</label>
        <input type="email" id="email" name="entry.EMAIL_ENTRY_ID" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="message">Tomar Message:</label>
        <textarea id="message" name="entry.MESSAGE_ENTRY_ID" placeholder="Apnar message ba 90s-er golpo..." required></textarea>
      </div>

      <button type="submit" class="submit-btn">Message Pathan 🚀</button>
    </form>
  </div>

  <footer>
    <p>© 1998–2026 90s Nostalgia Machine. Best viewed on Google Chrome Desktop.</p>
  </footer>

</body>
</html>
